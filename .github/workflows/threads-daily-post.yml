name: Daily Threads post (@smartaiworkflows)

# Fully automatic daily Threads post — zero taps.
# Picks one evergreen post from the bank, rotating by day of year,
# and publishes via the Threads API (create container -> publish).
#
# Required repo secrets:
#   THREADS_USER_ID_SMARTAI / THREADS_TOKEN_SMARTAI
# Bank file: threads/bank-smartaiworkflows.txt
# (posts separated by a line containing exactly ---POST---)
#
# NOTE: @ayooconcept is intentionally NOT auto-posted — the user reviews
# each draft before publishing (handled via the Muse approval flow).
#
# Hardened 2026-11-10 after run #2 failed at publish with a bare HTTP 400:
# the script now prints the API error body on failure, polls the container
# status until FINISHED before publishing, and retries publish once.
#
# Fix 2026-11-10 (run #3): the status field is `status`, not `status_code`
# (status_code is the Instagram field). The retry re-checks status first
# so it can never double-post.

on:
  schedule:
    - cron: '0 13 * * *'  # 9am ET daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-smartai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post today's thread
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID_SMARTAI }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN_SMARTAI }}
          BANK_FILE: threads/bank-smartaiworkflows.txt
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, time, urllib.error, urllib.parse, urllib.request

          posts = [p.strip() for p in open(os.environ["BANK_FILE"], encoding="utf-8").read().split("---POST---") if p.strip()]
          if not posts:
              raise SystemExit("bank file is empty")
          idx = datetime.date.today().timetuple().tm_yday % len(posts)
          text = posts[idx]
          if len(text) > 500:
              raise SystemExit(f"post too long ({len(text)} chars)")

          uid = os.environ["THREADS_USER_ID"]
          token = os.environ["THREADS_TOKEN"]
          BASE = f"https://graph.threads.net/v1.0/{uid}"

          def api_post(path, data):
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data=urllib.parse.urlencode(data).encode(),
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("API error:", e.code, e.read().decode("utf-8", "replace"))
                  raise

          def api_get(path, params):
              qs = urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  f"https://graph.threads.net/v1.0{path}?{qs}", method="GET"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("API error:", e.code, e.read().decode("utf-8", "replace"))
                  raise

          def container_status(cid):
              info = api_get(f"/{cid}", {"fields": "status,error_message", "access_token": token})
              return info.get("status"), info.get("error_message")

          container = api_post("/threads", {"media_type": "TEXT", "text": text, "access_token": token})
          cid = container.get("id")
          print("container:", cid)

          # Wait until the container is ready to publish.
          status = None
          for _ in range(12):
              try:
                  status, err = container_status(cid)
              except urllib.error.HTTPError:
                  status, err = None, None
                  print("status check failed, retrying...")
              print("container status:", status, err or "")
              if status == "FINISHED":
                  break
              if status == "PUBLISHED":
                  print("container already published, nothing to do")
                  raise SystemExit(0)
              if status == "ERROR":
                  raise SystemExit(f"container failed: {err}")
              if status == "EXPIRED":
                  raise SystemExit("container expired before publish")
              time.sleep(10)
          else:
              raise SystemExit("container never reached FINISHED")

          # Publish, with one retry. Re-check status before retrying so a
          # retry never double-posts (a publish can succeed server-side
          # and still return an error).
          def do_publish():
              return api_post("/threads_publish", {"creation_id": cid, "access_token": token})

          try:
              published = do_publish()
          except urllib.error.HTTPError:
              print("publish attempt 1 failed, checking status before retry...")
              time.sleep(10)
              try:
                  status, _ = container_status(cid)
              except urllib.error.HTTPError:
                  status = None
              if status == "PUBLISHED":
                  print("publish actually went through, container is PUBLISHED")
                  published = {"id": cid}
              elif status in ("FINISHED", None):
                  published = do_publish()
              else:
                  raise SystemExit(f"not retrying, container status is {status}")
          print("published:", published.get("id"))
          PYEOF
