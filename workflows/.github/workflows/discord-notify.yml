name: Discord notifications

# Posts a short, formatted message to a Discord channel on the main
# repo events. Needs a repo secret named DISCORD_WEBHOOK containing
# the channel's Discord webhook URL.
"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened, review_requested]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const e = context.payload;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            let msg = null;
            if (context.eventName === "push") {
              const branch = context.ref.replace("refs/heads/", "");
              const commits = (e.commits || []).slice(0, 5)
                .map(c => `• ${c.message.split("\n")[0]} (\`${c.id.slice(0, 7)}\`)`)
                .join("\n");
              msg = `📦 **${repo}** — push to \`${branch}\` by ${e.pusher.name}\n${commits}\n${e.compare}`;
            } else if (context.eventName === "pull_request") {
              const pr = e.pull_request;
              msg = `🔀 **${repo}** — PR #${pr.number} *${pr.title}* — ${e.action} by ${pr.user.login}\n${pr.html_url}`;
            } else if (context.eventName === "issues") {
              const i = e.issue;
              msg = `📝 **${repo}** — issue #${i.number} *${i.title}* — ${e.action} by ${i.user.login}\n${i.html_url}`;
            } else if (context.eventName === "release") {
              const r = e.release;
              msg = `🚀 **${repo}** — released **${r.tag_name}** (*${r.name || ""}*)\n${r.html_url}`;
            } else {
              msg = `ℹ️ **${repo}** — ${context.eventName}`;
            }
            if (msg.length > 1900) msg = msg.slice(0, 1900) + "…";
            await fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: msg }),
            });
